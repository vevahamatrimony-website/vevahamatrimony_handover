<!DOCTYPE html><html lang="en"><head><script src="auth-guard.js"></script><meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/vevaha-logo.png"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Profile - VevahaMatrimony</title><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"><link href="style.css" rel="stylesheet"><style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        .form-section {
            background-color: white;
            border-radius: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #f3f4f6;
            transition: all 0.3s ease;
        }

        .form-section:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            transition: all 0.3s ease;
            color: #1f2937;
        }

        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ec4899;
            background-color: white;
        }

        .section-icon {
            width: 3rem;
            height: 3rem;
            background: linear-gradient(to bottom right, #ec4899, #db2777);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            box-shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.1);
        }

        .loading-overlay {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.8);
        }
    </style></head><body class="bg-gradient-to-br from-pink-50 to-white min-h-screen">
<!-- Navigation --><nav class="bg-white border-b border-gray-100 fixed top-0 left-0 right-0 z-50 shadow-sm"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"><div class="flex items-center gap-3"><a href="home.html" class="flex items-center text-2xl font-bold text-pink-600"><img src="images/vevaha-logo.png" alt="Vevaha" class="w-12 h-12 mr-3">
                    VevahaMatrimony
                </a></div><div class="flex items-center gap-4"><a href="home.html"
                    class="text-gray-600 hover:text-pink-600 font-semibold px-4 py-2 rounded-xl hover:bg-pink-50 transition">Dashboard</a><button onclick="handleLogout()"
                    class="bg-gray-100 text-gray-700 px-6 py-2 rounded-xl font-bold hover:bg-gray-200 transition">Logout</button></div></div></nav><main class="max-w-4xl mx-auto px-4 py-32"><div class="flex items-center justify-between mb-12"><div><h1 class="text-4xl font-black text-gray-900 mb-2">Edit Your Profile</h1><p class="text-gray-500">Update your details to find better matches</p></div><a href="profile.html" class="flex items-center gap-2 text-pink-600 font-bold hover:underline"><i class="fas fa-eye"></i> View Public Profile
            </a></div><form id="editProfileForm" class="space-y-8"><!-- Basic Information --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-user"></i></div><h2 class="text-2xl font-bold text-gray-800">Basic Information</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Full Name *</label><input type="text" name="full_name" required class="form-input"></div><div><label class="form-label">Gender *</label><select name="gender" required class="form-input"><option value="male">Male</option><option value="female">Female</option></select></div><div><label class="form-label">Date of Birth *</label><input type="date" name="date_of_birth" required class="form-input"></div><div><label class="form-label">Marital Status *</label><select name="marital_status" required class="form-input"><option value="never-married">Never Married</option><option value="divorced">Divorced</option><option value="widowed">Widowed</option><option value="awaiting-divorce">Awaiting Divorce</option></select></div></div></section><!-- Religious & Cultural Details --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-om"></i></div><h2 class="text-2xl font-bold text-gray-800">Religious Details</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Religion</label><input type="text" name="religion" class="form-input" placeholder="e.g. Hindu"></div><div><label class="form-label">Caste / Sub-Caste</label><input type="text" name="caste" class="form-input"></div><div><label class="form-label">Rasi</label><input type="text" name="rasi" class="form-input"></div><div><label class="form-label">Star (Nakshatra)</label><input type="text" name="star" class="form-input"></div></div></section><!-- Education & Career --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-graduation-cap"></i></div><h2 class="text-2xl font-bold text-gray-800">Education & Work</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Highest Education</label><input type="text" name="education" class="form-input"></div><div><label class="form-label">Profession / Job Title</label><input type="text" name="job_roles" class="form-input"></div><div><label class="form-label">Company Name</label><input type="text" name="works_at" class="form-input"></div><div><label class="form-label">Annual Income</label><input type="text" name="annual_income" class="form-input"></div></div></section><!-- Family Details --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-users"></i></div><h2 class="text-2xl font-bold text-gray-800">Family Background</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Father's Status</label><select name="father_status" class="form-input"><option value="live">Alive</option><option value="passed-away">Passed Away</option></select></div><div><label class="form-label">Mother's Status</label><select name="mother_status" class="form-input"><option value="live">Alive</option><option value="passed-away">Passed Away</option></select></div><div><label class="form-label">Family Type</label><select name="family_type" class="form-input"><option value="nuclear">Nuclear</option><option value="joint">Joint</option></select></div></div></section><!-- Lifestyle & Habits --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-leaf"></i></div><h2 class="text-2xl font-bold text-gray-800">Lifestyle</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Eating Habits</label><select name="eating_habits" class="form-input"><option value="veg">Vegetarian</option><option value="non-veg">Non-Vegetarian</option><option value="eggetarian">Eggetarian</option></select></div><div><label class="form-label">Smoking Habits</label><select name="smoking_habits" class="form-input"><option value="no">Never</option><option value="occasional">Occasional</option><option value="yes">Yes</option></select></div><div><label class="form-label">Drinking Habits</label><select name="drinking_habits" class="form-input"><option value="no">Never</option><option value="occasional">Social / Occasional</option><option value="yes">Yes</option></select></div></div></section><!-- Partner Preferences --><section class="form-section"><div class="flex items-center gap-4 mb-8"><div class="section-icon"><i class="fas fa-heart"></i></div><h2 class="text-2xl font-bold text-gray-800">Partner Preferences</h2></div><div class="space-y-6"><div><label class="form-label">Expectations In A Partner</label><textarea name="about_myself" rows="4" class="form-input resize-none"
                            placeholder="Describe what you are looking for in a partner..."></textarea></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="form-label">Preferred Age From</label><input type="number" name="preferred_age_from" class="form-input" placeholder="e.g. 24"></div><div><label class="form-label">Preferred Height From</label><input type="text" name="preferred_height_from" class="form-input" placeholder="e.g. 5'2"></div></div></div></section><!-- Action Buttons --><div class="flex flex-col sm:flex-row gap-4 pt-8"><button type="submit"
                    class="flex-1 bg-gradient-to-r from-pink-500 to-pink-600 text-white py-5 rounded-[1.5rem] font-bold text-lg shadow-xl shadow-pink-200 hover:shadow-pink-300 hover:-translate-y-1 transition-all flex items-center justify-center gap-3"><i class="fas fa-save"></i> Save Profile Changes
                </button><a href="home.html"
                    class="px-10 py-5 bg-gray-100 text-gray-700 rounded-[1.5rem] font-bold text-lg text-center hover:bg-gray-200 transition">
                    Cancel
                </a></div></form></main><!-- Loading Overlay --><div id="loadingOverlay" class="fixed inset-0 z-[100] loading-overlay hidden items-center justify-center flex-col"><div class="w-16 h-16 border-4 border-pink-200 border-t-pink-600 rounded-full animate-spin mb-4"></div><p class="text-pink-600 font-bold text-lg animate-pulse">Saving Changes...</p></div><!-- Scripts -->
<script>

</script>
<script src="language.js"></script>
</body></html>
